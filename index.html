<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>Prospection — Agri Santerre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
/* =================================================================
   Charte graphique Agri Santerre
   Rouge #C8102E · Noir · Gris — League Spartan (titres) / Montserrat
   Motif signature : la barre inclinée à -18°, reprise du logo.
   ================================================================= */
:root{
  --rouge:#c8102e; --rouge-f:#9e0c24; --rouge-p:#e8334f;
  --noir:#0e0f12;  --noir-2:#1c1f24;
  --gris:#5a6068;  --gris-2:#8a9097;
  --gris-c:#e9ebed; --papier:#f2f3f5;
  --panel:#ffffff; --ligne:#d7dade;

  /* alias conservés pour ne rien casser ailleurs */
  --ink:var(--noir); --muted:var(--gris); --stone:var(--gris-c);
  --field:var(--noir); --field-2:var(--rouge);
  --gold:var(--rouge); --gold-soft:var(--rouge-p);
  --danger:#c8102e; --ok:#1f7a44;

  --shadow:0 1px 0 rgba(14,15,18,.04), 0 8px 22px -14px rgba(14,15,18,.45);
  --skew:-18deg;
  --r:2px; --r-sm:2px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Montserrat",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--papier); color:var(--noir);
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;
}
h1,h2,h3{font-family:"League Spartan","Montserrat",system-ui,sans-serif;
  text-transform:uppercase; letter-spacing:.01em; font-weight:800}
button{font-family:inherit; cursor:pointer}
a{color:inherit}
.num{font-family:"League Spartan","Montserrat",sans-serif; font-variant-numeric:tabular-nums; font-weight:800}

/* La barre inclinée du logo, en élément décoratif réutilisable */
.slash{display:inline-block;width:7px;height:16px;background:var(--rouge);
  transform:skewX(var(--skew));flex:none}

/* ---------- App bar ---------- */
.appbar{
  position:sticky; top:0; z-index:40; background:var(--noir); color:#fff;
  padding:calc(env(safe-area-inset-top) + 11px) 16px 11px;
  display:flex; align-items:center; gap:12px;
  border-bottom:3px solid var(--rouge);
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand .glyph{width:34px;height:30px;flex:none;display:grid;place-items:center}
.brand .glyph svg{width:34px;height:26px}
.brand .name{font-family:"League Spartan",sans-serif;font-weight:800;text-transform:uppercase;
  letter-spacing:.02em;font-size:16px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .name small{display:block;font-family:"Montserrat",sans-serif;font-weight:500;
  font-size:10px;color:var(--gris-2);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:9px}
/* Le biais est réservé aux éléments sans texte : il pencherait les initiales. */
.who .avatar{width:31px;height:31px;background:var(--rouge);color:#fff;
  display:grid;place-items:center;font-family:"League Spartan",sans-serif;
  font-weight:800;font-size:12.5px;flex:none}
.who .me{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.who .me b{font-family:"League Spartan",sans-serif;font-weight:700;font-size:13px;color:#fff;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}
.who .me small{font-size:9.5px;color:var(--gris-2);letter-spacing:.08em;text-transform:uppercase}
.iconbtn{background:none;border:1px solid rgba(255,255,255,.28);color:#fff;
  width:33px;height:33px;display:grid;place-items:center;flex:none;border-radius:0}
.iconbtn:hover{border-color:var(--rouge);background:var(--rouge)}
.iconbtn svg{width:16px;height:16px}
.iconbtn.spin svg{animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Onglets ---------- */
.tabs{position:sticky;top:calc(env(safe-area-inset-top) + 56px);z-index:39;background:var(--papier);
  display:flex;align-items:center;gap:0;padding:0 12px;border-bottom:1px solid var(--ligne)}
.tab{border:none;background:none;padding:13px 16px;color:var(--gris);
  font-family:"League Spartan",sans-serif;font-weight:700;font-size:13.5px;
  text-transform:uppercase;letter-spacing:.04em;position:relative}
.tab.active{color:var(--noir)}
.tab.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;background:var(--rouge)}
.tab .badge{font-size:11px;color:var(--gris-2);margin-left:6px;font-weight:600}

.wrap{max-width:920px;margin:0 auto;padding:18px 14px 90px}

/* ---------- Podium ---------- */
.hero-h{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px;gap:10px;flex-wrap:wrap}
.hero-h h1{font-size:21px;margin:0;line-height:1.05;padding-left:14px;position:relative}
.hero-h h1::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:6px;
  background:var(--rouge);transform:skewX(var(--skew))}
.hero-h p{margin:5px 0 0 14px;color:var(--gris);font-size:12px;
  text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:6px;align-items:end;margin-bottom:8px}
/* min-width:0 : sans lui, une cellule de grille ne peut pas devenir plus étroite
   que son contenu, et un nom long fait déborder tout le podium sur mobile. */
.pod{padding:16px 10px 13px;text-align:center;color:#fff;position:relative;
  box-shadow:var(--shadow);min-width:0}
.pod .medal{position:absolute;top:-12px;left:50%;width:26px;height:24px;
  display:grid;place-items:center;font-family:"League Spartan",sans-serif;font-weight:800;
  font-size:13px;color:#fff;transform:translateX(-50%);background:var(--noir)}
.pod .pname{font-family:"League Spartan",sans-serif;font-weight:700;text-transform:uppercase;
  font-size:13px;line-height:1.15;margin:9px 0 3px;overflow-wrap:anywhere}
.pod .pcount{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1}
.pod .plabel{font-size:10px;opacity:.8;margin-top:3px;text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.pod.p1{background:var(--rouge);min-height:152px}
.pod.p2{background:var(--noir);min-height:126px}
.pod.p3{background:var(--gris);min-height:112px}
.pod.empty{background:var(--gris-c);color:var(--gris)}
.pod.empty .pcount{color:var(--gris-2)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0}
.kpi{background:var(--panel);border:1px solid var(--ligne);border-left:4px solid var(--noir);padding:13px 12px}
.kpi .v{font-family:"League Spartan",sans-serif;font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1}
.kpi .l{font-size:10.5px;color:var(--gris);margin-top:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi.acc{border-left-color:var(--rouge)}
.kpi.acc .v{color:var(--rouge)}

/* ---------- Titre de section ---------- */
.section-t{font-family:"League Spartan",sans-serif;font-size:13px;font-weight:800;color:var(--noir);
  text-transform:uppercase;letter-spacing:.05em;margin:26px 0 9px;display:flex;align-items:center;gap:9px}
.section-t::before{content:"";width:6px;height:14px;background:var(--rouge);transform:skewX(var(--skew));flex:none}
.section-t::after{content:"";flex:1;height:1px;background:var(--ligne)}

/* ---------- Classement ---------- */
.rank{background:var(--panel);border:1px solid var(--ligne)}
.rrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--ligne)}
.rrow:first-child{border-top:none}
.rrow.me{background:#fdf2f4;box-shadow:inset 4px 0 0 var(--rouge)}
.rrow .pos{width:22px;text-align:center;font-family:"League Spartan",sans-serif;
  font-weight:800;color:var(--gris-2);font-size:15px}
.rrow .ava{width:32px;height:30px;background:var(--noir);color:#fff;display:grid;place-items:center;
  font-family:"League Spartan",sans-serif;font-weight:700;font-size:12px;flex:none}
.rrow.me .ava{background:var(--rouge)}
.rrow .rn{flex:1;min-width:0}
.rrow .rn b{font-family:"League Spartan",sans-serif;font-weight:700;font-size:14.5px;text-transform:uppercase}
.rrow .rn small{display:block;color:var(--gris);font-size:11.5px}
.rrow .bars{display:flex;gap:14px;align-items:center}
.rrow .stat{text-align:right}
.rrow .stat .n{font-family:"League Spartan",sans-serif;font-weight:800;font-size:16px}
.rrow .stat .n.g{color:var(--rouge)}
.rrow .stat .t{font-size:9px;color:var(--gris-2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.rrow .stat.sm{display:none}

/* ---------- Barre d'outils ---------- */
.toolbar{position:sticky;top:calc(env(safe-area-inset-top) + 101px);z-index:30;background:var(--papier);padding:8px 0 10px}
.search{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--ligne);
  border-left:4px solid var(--noir);padding:10px 14px}
.search svg{width:16px;height:16px;color:var(--gris-2);flex:none}
.search input{border:none;outline:none;background:none;flex:1;font-size:15px;color:var(--noir);
  min-width:0;font-family:inherit}
.chips{display:flex;gap:5px;overflow-x:auto;padding:9px 2px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--ligne);background:var(--panel);color:var(--gris);
  padding:8px 13px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.chip.on{background:var(--noir);border-color:var(--noir);color:#fff}
.chip .c{opacity:.65;font-size:11px;margin-left:5px}
.resline{display:flex;justify-content:space-between;align-items:center;color:var(--gris);
  font-size:11.5px;margin:6px 0 10px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.resline select{border:1px solid var(--ligne);padding:6px 8px;background:var(--panel);
  font-size:12px;color:var(--noir);font-family:inherit;border-radius:0}

/* ---------- Fiche client ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--ligne);box-shadow:var(--shadow)}
.chead{display:flex;gap:12px;padding:14px;cursor:pointer;align-items:flex-start}
.chead .flag{width:5px;align-self:stretch;background:var(--gris-c);flex:none}
.card.s-proj .flag{background:var(--rouge)}
.card.s-rep  .flag{background:var(--noir)}
.card.s-cont .flag{background:var(--gris-2)}
.ctitle{flex:1;min-width:0}
.ctitle .nm{font-family:"League Spartan",sans-serif;font-weight:700;font-size:15.5px;
  text-transform:uppercase;line-height:1.2}
.ctitle .meta{color:var(--gris);font-size:12.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:3px 10px}
.ctitle .meta .naf{width:100%;color:var(--gris-2);font-size:11.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.pill{font-size:10.5px;font-weight:700;padding:4px 8px;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.pill.year{background:var(--panel);color:var(--noir);border:1px solid var(--noir)}
.pill.year.soon{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.pill.mach{background:var(--gris-c);color:var(--gris)}
.statustags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.stag{font-size:10px;font-weight:700;padding:3px 7px;text-transform:uppercase;letter-spacing:.03em}
.stag.c{background:var(--gris-c);color:var(--gris)}
.stag.r{background:var(--noir);color:#fff}
.stag.p{background:var(--rouge);color:#fff}

.cbody{border-top:1px solid var(--ligne);padding:0 14px;max-height:0;overflow:hidden;transition:max-height .28s ease}
.card.open .cbody{max-height:1400px}
.cbody-in{padding:15px 0 16px}
.calls{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.callbtn{display:inline-flex;align-items:center;gap:8px;background:var(--rouge);color:#fff;border:none;
  padding:10px 15px;font-size:14px;font-weight:700;text-decoration:none;font-family:"League Spartan",sans-serif;
  letter-spacing:.02em}
.callbtn svg{width:15px;height:15px}
.callbtn.alt{background:var(--panel);color:var(--noir);border:1px solid var(--noir)}
.notel{color:var(--gris-2);font-size:13px;font-style:italic}
.addr{color:var(--gris);font-size:13px;margin-bottom:15px;display:flex;gap:8px;align-items:flex-start}
.addr svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--rouge)}

.mach-h{font-size:10.5px;font-weight:700;color:var(--gris);margin:0 0 8px;
  text-transform:uppercase;letter-spacing:.06em}
.mach{border:1px solid var(--ligne);margin-bottom:16px}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-top:1px solid var(--ligne);font-size:13px}
.mrow:first-child{border-top:none}
.mrow .mmq{font-family:"League Spartan",sans-serif;font-weight:700;text-transform:uppercase}
.mrow .mmd{color:var(--gris)}
.mrow .mspacer{flex:1}
.mrow .mcat{font-size:11px;color:var(--gris-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.mrow .mon{font-size:9.5px;font-weight:700;padding:3px 6px;background:var(--gris-c);color:var(--gris);
  text-transform:uppercase;letter-spacing:.04em}
.mrow .man{font-size:11px;color:var(--rouge);font-weight:700;white-space:nowrap}
.mmore{padding:8px 11px;font-size:12px;color:var(--gris-2);background:#fafbfb;border-top:1px solid var(--ligne)}

/* ---------- Suivi ---------- */
.track{background:#fafbfb;border:1px solid var(--ligne);border-left:4px solid var(--noir);padding:14px}
.track-h{font-size:10.5px;font-weight:700;color:var(--gris);margin-bottom:11px;
  display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.06em}
.track-h .saved{color:var(--ok);font-weight:700;font-size:10.5px;opacity:0;transition:opacity .2s}
.track-h .saved.show{opacity:1}
.toggles{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.tgl{flex:1;min-width:120px;border:1px solid var(--ligne);background:var(--panel);padding:10px;
  display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--noir);text-align:left}
.tgl .box{width:19px;height:19px;border:2px solid var(--ligne);flex:none;display:grid;place-items:center}
.tgl .box svg{width:13px;height:13px;opacity:0}
.tgl.on{border-color:var(--noir)}
.tgl.on .box{background:var(--noir);border-color:var(--noir)}
.tgl.on .box svg{opacity:1;color:#fff}
.tgl.proj.on{border-color:var(--rouge);background:#fdf2f4}
.tgl.proj.on .box{background:var(--rouge);border-color:var(--rouge)}
.field-l{font-size:10.5px;font-weight:700;color:var(--gris);margin:4px 0 7px;
  text-transform:uppercase;letter-spacing:.06em}
.segs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:13px}
.seg{border:1px solid var(--ligne);background:var(--panel);color:var(--gris);padding:7px 12px;
  font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.seg.on{background:var(--noir);color:#fff;border-color:var(--noir)}
.notes{width:100%;border:1px solid var(--ligne);padding:10px 11px;font-family:inherit;font-size:13.5px;
  resize:vertical;min-height:54px;background:var(--panel);color:var(--noir);border-radius:0}
.notes:focus{outline:2px solid var(--rouge);outline-offset:-1px}
.by{font-size:10.5px;color:var(--gris-2);margin-top:9px;text-transform:uppercase;letter-spacing:.04em}

.loadmore{display:block;width:100%;margin-top:12px;background:var(--noir);border:none;color:#fff;
  padding:13px;font-family:"League Spartan",sans-serif;font-size:13px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em}
.loadmore:hover{background:var(--rouge)}
.empty{text-align:center;padding:50px 20px;color:var(--gris)}
.empty svg{width:38px;height:38px;opacity:.35;margin-bottom:12px}
.empty b{display:block;font-family:"League Spartan",sans-serif;color:var(--noir);font-size:16px;
  margin-bottom:5px;font-weight:800;text-transform:uppercase}

/* ---------- Connexion ---------- */
.gate{position:fixed;inset:0;background:rgba(14,15,18,.6);z-index:80;display:none;place-items:center;padding:20px}
.gate.show{display:grid}
.gate.lock{background:var(--noir);z-index:95}
.gatebox{background:var(--panel);padding:26px 24px;max-width:390px;width:100%;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.6);border-top:4px solid var(--rouge)}
.gatebox h3{margin:0 0 5px;font-size:20px}
.gatebox p{margin:0 0 18px;color:var(--gris);font-size:13px}
.gatebox label{display:block;font-size:10.5px;font-weight:700;color:var(--gris);margin:0 0 6px;
  text-transform:uppercase;letter-spacing:.06em}
.gatebox input,.gatebox select{width:100%;padding:12px 14px;border:1px solid var(--ligne);
  font-size:16px;background:var(--papier);color:var(--noir);margin-bottom:13px;font-family:inherit;border-radius:0}
.gatebox input:focus,.gatebox select:focus{outline:2px solid var(--rouge);outline-offset:-1px}
.gatebox button{width:100%;background:var(--rouge);color:#fff;border:none;padding:14px;
  font-family:"League Spartan",sans-serif;font-size:15px;font-weight:800;
  text-transform:uppercase;letter-spacing:.05em;border-radius:0}
.gatebox button:hover{background:var(--rouge-f)}
.gatebox button:disabled{opacity:.45}
.gatebox .err{color:var(--rouge);font-size:12.5px;margin:-6px 0 11px;min-height:16px;font-weight:600}
.gate.lock .glyph-l{width:74px;height:56px;margin:0 0 14px;display:grid;place-items:center}
.gate.lock .glyph-l svg{width:74px;height:56px}

/* ---------- Divers ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:90;
  background:var(--noir);color:#fff;padding:13px 20px;font-size:13px;font-weight:600;
  opacity:0;transition:.25s;pointer-events:none;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);
  border-left:4px solid var(--rouge)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.sync{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--gris);white-space:nowrap;
  padding-right:4px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.sync .dot{width:7px;height:7px;background:var(--gris-2);flex:none;transform:skewX(var(--skew))}
.sync.ok .dot{background:var(--ok)}
.sync.off .dot{background:var(--rouge)}
.sync.busy .dot{background:#d8891a;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.syncbar{background:var(--noir);color:#fff;padding:9px 14px;font-size:12px;text-align:center;
  display:none;font-weight:500;border-bottom:2px solid var(--rouge)}
.syncbar.show{display:block}
.syncbar.bad{background:var(--rouge);border-bottom-color:var(--noir)}

.adminlink{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:#fff;
  text-decoration:none;background:var(--noir);padding:8px 13px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em}
.adminlink:hover{background:var(--rouge)}
.adminlink::before{content:"";width:5px;height:11px;background:var(--rouge);transform:skewX(var(--skew))}
.adminlink:hover::before{background:#fff}
.scope{font-size:12px;color:var(--gris);margin:0 0 10px}
.scope b{color:var(--noir);font-weight:700}

/* Sous 520px, seule la colonne « projets » tient sans pousser la ligne
   hors de l'écran ; les deux compteurs secondaires réapparaissent au-delà. */
@media(min-width:521px){
  .rrow .stat.sm{display:block}
}
@media(max-width:520px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .rrow{gap:10px;padding:11px 12px}
  .rrow .bars{gap:10px}
  .rrow .rn b{font-size:13.5px}
  .hero-h h1{font-size:19px}
  .who .me{display:none}
  .pod .pname{font-size:11.5px}
  .pod .pcount{font-size:32px}
  .pod .plabel{font-size:9px;letter-spacing:.05em}
  .wrap{padding:16px 12px 90px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.brand .glyph{color:var(--rouge)}
.gate.lock .glyph-l{color:var(--rouge)}

</style>
</head>

<div class="appbar">

"use strict";

/* =================================================================
   ███  CONFIGURATION — LES 2 SEULES LIGNES À REMPLIR  ███
   =================================================================
   Supabase > Project Settings > Data API
     1. SUPABASE_URL      : Project URL  (https://xxxx.supabase.co)
     2. SUPABASE_ANON_KEY : clé publique « anon » ou « publishable »
                            — jamais la clé secrète / service_role.

   Cette page ne contient aucune donnée client : tout vient de Supabase,
   filtré par vendeur côté serveur. Elle peut donc être publiée telle
   quelle sur GitHub Pages.
   ================================================================= */
const CONFIG = {
  SUPABASE_URL:      "https://ufpiusdeicxjnctukojq.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_urTGUo3Hr0vpswqQstzn3w_5ptb5ERX"
};

const SB = {
  // Supabase affiche l'URL tantôt nue, tantôt suffixée de /rest/v1 selon l'écran
  // où on la copie : on accepte les deux formes plutôt que de renvoyer un 404.
  url: (CONFIG.SUPABASE_URL||"").trim().replace(/\/+$/,"").replace(/\/rest\/v1$/,"").replace(/\/+$/,""),
  key: (CONFIG.SUPABASE_ANON_KEY||"").trim()
};
const SB_READY = /^https:\/\/[^\s/]+/.test(SB.url) && SB.key.length > 30;

const NOW_YEAR = 2026;
const POLL_MS  = 15000;

const SESSION_KEY = "ags.prospection.session.v2";
const CACHE_KEY   = "ags.prospection.cache.v2";
const QUEUE_KEY   = "ags.prospection.queue.v2";

/* ---------------- État ---------------- */
let SESSION = null;   // { access_token, refresh_token, expires_at }
let ME      = null;   // { vendeur_id, nom_affiche, admin }
let CLIENTS = [];     // uniquement ce que le serveur a bien voulu envoyer
let STATUS  = {};     // { client_id: {c,r,p,n,by,at,cby,rby,pby} }
let BOARD   = [];     // podium (agrégats de toute l'équipe)
let TEAM    = {projets:0,reponses:0,contacts:0,clients:0};
let NAMES   = {};     // vendeur_id -> nom affiché

let VIEW = "home";
const FILTERS = {secteur:"mine", statut:"all", q:"", sort:"achat"};
let PAGE = 60;

let LAST_SYNC = null;
let QUEUE     = [];
let SENDING   = false;
let ONLINE    = true;
let pollTimer = null;

const $ = s=>document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};

/* ---------------- Affichage ---------------- */
function titleize(s){return s.replace(/(^|[\s\-])([a-zà-ÿ])/g,(m,p,l)=>p+l.toUpperCase());}
function displayName(id){
  if(!id) return "—";
  if(NAMES[id]) return NAMES[id];
  const p=id.split(".");
  if(p.length===2) return titleize(p[1])+" "+titleize(p[0]);
  return titleize(id.replace(/\./g," "));
}
function initials(id){
  const n=displayName(id).split(" ").filter(Boolean);
  return ((n[0]||"·")[0]+(n[1]||"")[0]||"·").toUpperCase();
}
function fmtPhone(p){return String(p).replace(/(\d{2})(?=\d)/g,"$1 ").trim();}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------------- Stockage local ---------------- */
function readLS(k,d){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch(e){return d;} }
function writeLS(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
function dropLS(k){ try{localStorage.removeItem(k);}catch(e){} }

/* =================================================================
   Authentification — Supabase Auth en REST, sans dépendance externe
   ================================================================= */
async function authFetch(path, body){
  const res = await fetch(SB.url+"/auth/v1/"+path, {
    method:"POST",
    headers:{ apikey:SB.key, "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error_description || data.msg || data.message || ("Erreur "+res.status));
  return data;
}
function storeSession(d){
  SESSION = {
    access_token: d.access_token,
    refresh_token: d.refresh_token,
    // on se réveille une minute avant l'échéance réelle
    expires_at: Date.now() + ((d.expires_in||3600)-60)*1000
  };
  writeLS(SESSION_KEY, SESSION);
}
async function signIn(email, password){
  const d = await authFetch("token?grant_type=password", {email, password});
  storeSession(d);
}
async function refreshSession(){
  if(!SESSION || !SESSION.refresh_token) throw new Error("Session absente");
  const d = await authFetch("token?grant_type=refresh_token", {refresh_token: SESSION.refresh_token});
  storeSession(d);
}
function signOut(){
  SESSION=null; ME=null; CLIENTS=[]; STATUS={}; BOARD=[];
  dropLS(SESSION_KEY); dropLS(CACHE_KEY); dropLS(QUEUE_KEY);
  clearInterval(pollTimer);
  location.reload();
}
async function validToken(){
  if(!SESSION) throw new Error("Non connecté");
  if(Date.now() >= SESSION.expires_at) await refreshSession();
  return SESSION.access_token;
}

/* =================================================================
   Accès aux données — toujours avec le jeton du vendeur connecté,
   jamais avec la seule clé publique : c'est ce qui fait le cloisonnement.
   ================================================================= */
async function sbFetch(path, opts={}, _retry){
  const token = await validToken();
  const ctrl = new AbortController();
  const kill = setTimeout(()=>ctrl.abort(), 20000);
  try{
    const res = await fetch(SB.url+"/rest/v1/"+path, {
      ...opts,
      signal: ctrl.signal,
      headers:{
        apikey: SB.key,
        Authorization: "Bearer "+token,
        "Content-Type":"application/json",
        ...(opts.headers||{})
      }
    });
    if(res.status===401 && !_retry){
      // jeton périmé entre-temps : on le renouvelle et on rejoue une fois
      await refreshSession();
      return sbFetch(path, opts, true);
    }
    if(!res.ok){
      const body = await res.text().catch(()=>"");
      throw new Error(`HTTP ${res.status} sur ${SB.url}/rest/v1/${path} — ${body.slice(0,200)}`);
    }
    return res;
  } finally { clearTimeout(kill); }
}
async function rpc(name, args){
  const res = await sbFetch("rpc/"+name, {method:"POST", body: JSON.stringify(args||{})});
  return res.json();
}

/* ---- état visuel ---- */
function setSync(state, txt){
  const d=$("#syncDot"); if(!d) return;
  d.className="sync "+state;
  $("#syncTxt").textContent=txt;
}
function banner(msg, bad){
  const b=$("#syncbar"); if(!b) return;
  if(!msg){ b.classList.remove("show"); return; }
  b.textContent=msg;
  b.classList.toggle("bad", !!bad);
  b.classList.add("show");
}
function syncLabel(){
  const n=QUEUE.length;
  if(!ONLINE){ setSync("off", n?`${n} en attente`:"hors ligne"); return; }
  if(n){ setSync("busy", `${n} en attente`); return; }
  setSync("ok", LAST_SYNC?"à jour":"synchro");
}

/* ---- conversion base <-> objet local ---- */
function rowToStatus(r){
  return {
    c: !!r.contacte, r: r.reponse||"", p: !!r.projet, n: r.notes||"",
    by: r.maj_par||null, at: r.maj_le||null,
    cby: r.contacte_par||null, rby: r.reponse_par||null, pby: r.projet_par||null
  };
}
function statusToRow(id,s){
  return {
    client_id:id, contacte:!!s.c, reponse:s.r||"", projet:!!s.p, notes:s.n||"",
    maj_par:s.by||null, maj_le:s.at||new Date().toISOString(),
    contacte_par:s.cby||null, reponse_par:s.rby||null, projet_par:s.pby||null
  };
}

/* ---- qui suis-je ---- */
async function loadMe(){
  const res = await sbFetch("vendeurs?select=vendeur_id,nom_affiche,admin&limit=1");
  const rows = await res.json();
  if(!rows.length) return null;          // compte non rattaché à un vendeur
  return rows[0];
}

/* ---- pagination générique (Supabase plafonne à 1000 lignes) ---- */
async function fetchAll(path){
  const out=[]; let from=0;
  for(;;){
    const res = await sbFetch(path, {headers:{ Range:`${from}-${from+999}` }});
    const rows = await res.json();
    out.push(...rows);
    if(rows.length < 1000) break;
    from += 1000;
  }
  return out;
}

/* ---- fichier clients (déjà filtré par le serveur) ---- */
async function loadClients(){
  const rows = await fetchAll(
    "clients?select=id,nom,adr,naf,tel,commercial,nb_machines,annee_achat,machines(ordre,marque,modele,categorie,etat,plaque,annee)&order=nom.asc"
  );
  CLIENTS = rows.map(r=>({
    id:r.id, nom:r.nom, adr:r.adr, naf:r.naf, tel:r.tel||[], com:r.commercial,
    nm:r.nb_machines||0, an:r.annee_achat,
    m:(r.machines||[]).sort((a,b)=>(a.ordre||0)-(b.ordre||0)).map(m=>({
      mq:m.marque, md:m.modele, c:m.categorie, on:m.etat, pl:m.plaque, an:m.annee
    }))
  }));
}

/* ---- suivis ---- */
async function loadStatuses(incremental){
  // `gte` plutôt que `gt` : on relit la dernière ligne connue, ce qui évite de
  // rater une écriture ayant exactement le même horodatage.
  const since = incremental && LAST_SYNC ? `&updated_at=gte.${encodeURIComponent(LAST_SYNC)}` : "";
  let max=null;
  const rows = await fetchAll(`prospection_status?select=*&order=updated_at.asc${since}`);
  if(!incremental){
    const keep={}; QUEUE.forEach(id=>{ if(STATUS[id]) keep[id]=STATUS[id]; });
    STATUS = keep;
  }
  rows.forEach(r=>{
    // une saisie locale en attente d'envoi fait foi jusqu'à sa remontée
    if(!QUEUE.includes(r.client_id)) STATUS[r.client_id] = rowToStatus(r);
    if(!max || r.updated_at > max) max = r.updated_at;
  });
  if(max) LAST_SYNC = max;
}

/* ---- podium : des compteurs, jamais de lignes clients ---- */
async function loadBoard(){
  BOARD = await rpc("podium");
  NAMES = {};
  BOARD.forEach(b=>{ NAMES[b.vendeur_id]=b.nom; });
  const s = await rpc("stats_equipe");
  if(s && s.length) TEAM = s[0];
}

/* ---- cache local : l'appli s'ouvre sur le dernier état connu ---- */
function loadCache(){
  const c = readLS(CACHE_KEY, null);
  if(c){
    STATUS = c.status||{}; LAST_SYNC = c.last||null;
    CLIENTS = c.clients||[]; BOARD = c.board||[]; TEAM = c.team||TEAM;
    NAMES = {}; BOARD.forEach(b=>{ NAMES[b.vendeur_id]=b.nom; });
  }
  QUEUE = readLS(QUEUE_KEY, []);
}
function saveCache(){
  writeLS(CACHE_KEY, {status:STATUS, last:LAST_SYNC, clients:CLIENTS, board:BOARD, team:TEAM});
}

/* ---- écriture : file d'attente + réessai ---- */
function saveStatus(id){
  if(!QUEUE.includes(id)) QUEUE.push(id);
  writeLS(QUEUE_KEY, QUEUE);
  saveCache();
  syncLabel();
  flushQueue();
}
async function flushQueue(){
  if(SENDING || !QUEUE.length || !SESSION) return;
  SENDING = true;
  try{
    while(QUEUE.length){
      const batch = QUEUE.slice(0,25);
      const rows  = batch.filter(id=>STATUS[id]).map(id=>statusToRow(id,STATUS[id]));
      if(rows.length){
        await sbFetch("prospection_status?on_conflict=client_id", {
          method:"POST",
          headers:{ Prefer:"resolution=merge-duplicates,return=minimal" },
          body: JSON.stringify(rows)
        });
      }
      QUEUE = QUEUE.slice(batch.length);
      writeLS(QUEUE_KEY, QUEUE);
      ONLINE = true;
      syncLabel();
    }
    banner(null);
    SENDING = false;
  }catch(e){
    ONLINE = false; SENDING = false;
    console.warn("Envoi impossible", e);
    banner("Envoi impossible — nouvelle tentative dans quelques secondes. Ne fermez pas l'onglet.", true);
    syncLabel();
    setTimeout(flushQueue, 8000);
  }
}

/* =================================================================
   Rendu : Prospection
   ================================================================= */
const BLANK = ()=>({c:false,r:"",p:false,n:"",by:null,at:null,cby:null,rby:null,pby:null});
function statusOf(id){return STATUS[id]||BLANK();}
function cardState(s){ return s.p?"s-proj":s.r?"s-rep":s.c?"s-cont":""; }

function baseList(){
  // Un vendeur ne reçoit déjà que son portefeuille : les filtres de secteur
  // n'ont de sens que pour l'administrateur, qui voit tout le fichier.
  if(!ME || !ME.admin) return CLIENTS;
  if(FILTERS.secteur==="mine") return CLIENTS.filter(c=>c.com===ME.vendeur_id);
  if(FILTERS.secteur==="free") return CLIENTS.filter(c=>c.com==="Non attribué");
  return CLIENTS;
}
function passStatut(c){
  const s=statusOf(c.id);
  switch(FILTERS.statut){
    case "todo": return !s.c;
    case "cont": return s.c;
    case "rep":  return !!s.r;
    case "proj": return s.p;
    case "soon": return c.an!=null && c.an<=NOW_YEAR+1;
    default: return true;
  }
}
function passQuery(c){
  const q=FILTERS.q.trim().toLowerCase(); if(!q) return true;
  if((c.nom||"").toLowerCase().includes(q)) return true;
  if((c.adr||"").toLowerCase().includes(q)) return true;
  return c.m.some(m=>(m.mq||"").toLowerCase().includes(q)||(m.md||"").toLowerCase().includes(q)||(m.pl||"").toLowerCase().includes(q));
}
function sortList(list){
  const a=[...list];
  if(FILTERS.sort==="achat") a.sort((x,y)=>(x.an==null?9999:x.an)-(y.an==null?9999:y.an)||(x.nom||"").localeCompare(y.nom||""));
  else if(FILTERS.sort==="nom") a.sort((x,y)=>(x.nom||"").localeCompare(y.nom||""));
  else if(FILTERS.sort==="machines") a.sort((x,y)=>y.nm-x.nm);
  return a;
}

  v.appendChild(resline);

  if(list.length===0){
    v.appendChild(CLIENTS.length===0

  }else{
    const wrap=el("div","list");
    list.slice(0,PAGE).forEach(c=>wrap.appendChild(clientCard(c)));
    v.appendChild(wrap);
    if(list.length>PAGE){
      const more=el("button","loadmore",`Afficher plus (${list.length-PAGE} restants)`);
      more.onclick=()=>{PAGE+=60; renderProspect();};
      v.appendChild(more);
    }
  }
  bindProspect();
}

function emptyBox(title,txt){
  const e=el("div","empty");
  e.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><b>${esc(title)}</b>${esc(txt)}`;
  return e;
}

function clientCard(c){
  const s=statusOf(c.id);
  const card=el("div","card "+cardState(s));
  card.dataset.id=c.id;
  const soon = c.an!=null && c.an<=NOW_YEAR+1;
  const yearPill = c.an!=null ? `<span class="pill year ${soon?"soon":""}">Achat ~${c.an}</span>` : "";
  const machPill = `<span class="pill mach num">${c.nm} mach.</span>`;
  const naf = c.naf ? `<span class="naf">${esc(c.naf)}</span>` : "";
  const stags = [
    s.c?'<span class="stag c">Contacté</span>':"",
    s.r?`<span class="stag r">${repLabel(s.r)}</span>`:"",
    s.p?'<span class="stag p">Projet</span>':""
  ].join("");

  card.innerHTML=`
    <div class="chead">
      <div class="flag"></div>
      <div class="ctitle">
        <div class="nm">${esc(c.nom||"Client sans nom")}</div>
        <div class="meta">
          <span>${esc(c.adr||"Adresse inconnue")}</span>
          ${naf}
        </div>
        ${stags?`<div class="statustags" style="margin-top:7px">${stags}</div>`:""}
      </div>
      <div class="tags">${yearPill}${machPill}</div>
    </div>
    <div class="cbody"><div class="cbody-in">${cardBody(c,s)}</div></div>`;

  card.querySelector(".chead").onclick=()=>card.classList.toggle("open");
  return card;
}

function repLabel(r){return {rappel:"À rappeler",interesse:"Intéressé",pasinteresse:"Pas intéressé",injoignable:"Injoignable"}[r]||"Réponse";}

function cardBody(c,s){
  let calls;
  if(c.tel && c.tel.length){
    calls = c.tel.map((p,i)=>`<a class="callbtn ${i>0?"alt":""}" href="tel:${esc(p)}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.4 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2Z"/></svg>
      ${fmtPhone(p)}</a>`).join("");
  }else{
    calls = `<span class="notel">Aucun numéro de téléphone au fichier</span>`;
  }

  const rows = c.m.map(m=>{
    const cat = m.c?`<span class="mcat">${esc(m.c)}</span>`:"";
    const on  = m.on?`<span class="mon">${m.on==="NEUF"?"Neuf":esc(m.on)}</span>`:"";
    const an  = m.an!=null?`<span class="man">~${m.an}</span>`:"";
    return `<div class="mrow">
      <span class="mmq">${esc(m.mq||"?")}</span>
      <span class="mmd">${esc(m.md||"")}</span>
      <span class="mspacer"></span>${cat}${on}${an}</div>`;
  }).join("");
  const more = c.nm>c.m.length?`<div class="mmore">+ ${c.nm-c.m.length} autres machines non détaillées</div>`:"";

  const track=`
    <div class="track">
      <div class="track-h"><span>Suivi de prospection</span><span class="saved" data-saved>Enregistré ✓</span></div>
      <div class="toggles">
        <button class="tgl cont ${s.c?"on":""}" data-act="c">
          <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-9"/></svg></span>Contacté</button>
        <button class="tgl proj ${s.p?"on":""}" data-act="p">
          <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-9"/></svg></span>Projet identifié</button>
      </div>
      <div class="field-l">Réponse obtenue</div>
      <div class="segs" data-rep>
        ${["rappel","interesse","pasinteresse","injoignable"].map(r=>
          `<button class="seg ${s.r===r?"on":""}" data-rep-v="${r}">${repLabel(r)}</button>`).join("")}
      </div>
      <div class="field-l">Notes</div>
      <textarea class="notes" data-notes placeholder="Compte-rendu d'appel, matériel visé, échéance…">${esc(s.n||"")}</textarea>
      ${s.by?`<div class="by">Dernière maj par ${esc(displayName(s.by))}${s.at?" · "+new Date(s.at).toLocaleDateString("fr-FR",{day:"2-digit",month:"short"}):""}</div>`:""}
    </div>`;

  const addr = c.adr?`<div class="addr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg><span>${esc(c.adr)}</span></div>`:"";

  return `<div class="calls">${calls}</div>${addr}
    <div class="mach-h">Parc matériel — ${c.nm} machine${c.nm>1?"s":""}</div>
    <div class="mach">${rows}${more}</div>${track}`;
}

/* ---------------- Interactions ---------------- */
function ensureStatus(id){ if(!STATUS[id]) STATUS[id]=BLANK(); return STATUS[id]; }

/* `touched` = les champs que le vendeur vient d'actionner ; ils lui sont crédités
   au podium. Les autres gardent l'auteur qui les avait posés. */
function commit(id, card, touched){
  const s=STATUS[id];
  const me=ME.vendeur_id;
  const credit={c:"cby", r:"rby", p:"pby"};
  (touched||[]).forEach(k=>{ s[credit[k]] = s[k] ? me : null; });
  if(s.c && !s.cby) s.cby=me;
  if(s.r && !s.rby) s.rby=me;
  if(s.p && !s.pby) s.pby=me;
  if(!s.c) s.cby=null;
  if(!s.r) s.rby=null;
  if(!s.p) s.pby=null;
  s.by=me; s.at=new Date().toISOString();
  saveStatus(id);
  const sv=card.querySelector("[data-saved]");
  if(sv){ sv.classList.add("show"); setTimeout(()=>sv.classList.remove("show"),1200); }
  card.className="card open "+cardState(s);
  updateMineBadge();
}

function bindProspect(){
  const q=$("#q");
  if(q){
    q.oninput=debounce(e=>{FILTERS.q=e.target.value; PAGE=60; const pos=q.selectionStart; renderProspect();
      const nq=$("#q"); if(nq){nq.focus(); try{nq.setSelectionRange(pos,pos);}catch(_){}}},220);
  }
  const sortSel=$("#sortSel"); if(sortSel) sortSel.onchange=e=>{FILTERS.sort=e.target.value; renderProspect();};
  document.querySelectorAll("#secteurChips .chip").forEach(b=>b.onclick=()=>{FILTERS.secteur=b.dataset.sec;PAGE=60;renderProspect();});
  document.querySelectorAll("#statutChips .chip").forEach(b=>b.onclick=()=>{FILTERS.statut=b.dataset.st;PAGE=60;renderProspect();});

  document.querySelectorAll(".card").forEach(card=>{
    const id=card.dataset.id;
    card.querySelectorAll(".tgl").forEach(t=>t.onclick=ev=>{
      ev.stopPropagation();
      const s=ensureStatus(id); const a=t.dataset.act; const touched=[a];
      s[a]=!s[a]; t.classList.toggle("on",s[a]);
      if(a==="p" && s.p && !s.c){s.c=true; touched.push("c"); const ct=card.querySelector(".tgl.cont"); if(ct)ct.classList.add("on");}
      commit(id,card,touched);
      if(a==="p") toast(s.p?"Projet crédité à "+displayName(ME.vendeur_id):"Projet retiré");
    });
    card.querySelectorAll("[data-rep-v]").forEach(seg=>seg.onclick=ev=>{
      ev.stopPropagation();
      const s=ensureStatus(id); const val=seg.dataset.repV; const touched=["r"];
      s.r = s.r===val ? "" : val;
      if(s.r && !s.c){ s.c=true; touched.push("c"); }
      card.querySelectorAll("[data-rep-v]").forEach(x=>x.classList.toggle("on",x.dataset.repV===s.r));
      const ct=card.querySelector(".tgl.cont"); if(ct)ct.classList.toggle("on",s.c);
      commit(id,card,touched);
    });
    const ta=card.querySelector("[data-notes]");
    if(ta){
      ta.oninput=debounce(()=>{ const s=ensureStatus(id); s.n=ta.value; commit(id,card); },500);
      ta.onclick=e=>e.stopPropagation();
    }
  });
}

function updateMineBadge(){
  const b=$("#mineBadge"); if(!b) return;
  const mine=CLIENTS;
  if(!mine.length){ b.textContent=""; return; }
  const done=mine.filter(c=>statusOf(c.id).c).length;
  b.textContent=`${done}/${mine.length}`;
}

/* ---------------- Divers ---------------- */
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._);toast._=setTimeout(()=>t.classList.remove("show"),1900);}
function debounce(fn,ms){let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>fn(...a),ms);};}

function switchView(view){
  VIEW=view;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.view===view));
  $("#viewHome").style.display = view==="home"?"block":"none";
  $("#viewProspect").style.display = view==="prospect"?"block":"none";
  if(view==="home") renderHome(); else renderProspect();
  window.scrollTo({top:0});
}

/* Un rafraîchissement automatique ne doit jamais effacer ce qu'on est en train
   de saisir : on saute le re-rendu de la liste tant qu'une fiche est ouverte
   ou qu'un champ a le focus. Le podium, lui, peut toujours se redessiner. */
function isEditing(){
  const a=document.activeElement;
  if(a && (a.tagName==="TEXTAREA"||a.tagName==="INPUT")) return true;
  return !!document.querySelector(".card.open");
}
function repaint(auto){
  if(VIEW==="home") renderHome();
  else if(!auto || !isEditing()) renderProspect();
  updateMineBadge();
}
async function refresh(btn, auto){
  if(btn) btn.classList.add("spin");
  try{
    await flushQueue();
    await loadStatuses(!!auto);
    await loadBoard();
    ONLINE=true; banner(null); saveCache();
  }catch(e){
    ONLINE=false;
    console.warn("Synchronisation impossible", e);
    banner("Pas de connexion au serveur — vos saisies sont gardées et repartiront automatiquement.", true);
  }
  syncLabel();
  repaint(auto);
  if(btn) setTimeout(()=>btn.classList.remove("spin"),400);
}
function startPolling(){
  clearInterval(pollTimer);
  pollTimer=setInterval(()=>{ if(!document.hidden) refresh(null,true); }, POLL_MS);
}

/* ---------------- Connexion ---------------- */
function showLogin(msg){
  const g=$("#loginGate");
  g.classList.add("show");
  if(msg) $("#loginErr").textContent=msg;
  setTimeout(()=>$("#loginEmail").focus(),100);
}
function bindLogin(){
  const btn=$("#loginOk"), mail=$("#loginEmail"), pwd=$("#loginPwd"), err=$("#loginErr");
  const go=async()=>{
    const e=mail.value.trim(), p=pwd.value;
    if(!e||!p){ err.textContent="Renseignez votre e-mail et votre mot de passe."; return; }
    btn.disabled=true; btn.textContent="Connexion…"; err.textContent="";
    try{
      await signIn(e,p);
      pwd.value="";
      $("#loginGate").classList.remove("show");
      await startApp();
    }catch(ex){
      const m=String(ex.message||"");
      err.textContent = /Invalid login/i.test(m)
        ? "E-mail ou mot de passe incorrect."
        : (/Email not confirmed/i.test(m) ? "Compte non confirmé — voyez votre messagerie." : m);
    }finally{
      btn.disabled=false; btn.textContent="Se connecter";
    }
  };
  btn.onclick=go;
  [mail,pwd].forEach(i=>i.onkeydown=e=>{ if(e.key==="Enter") go(); });
}

function setIdentity(){
  $("#meAva").textContent = ME?initials(ME.vendeur_id):"–";
  $("#meName").textContent = ME?ME.nom_affiche:"—";
  $("#meRole").textContent = ME?(ME.admin?"administrateur":"vendeur"):"";
}

/* ---------------- Démarrage ---------------- */
async function startApp(){
  loadCache();
  syncLabel();

  ME = await loadMe();
  if(!ME){
    banner("Votre compte n'est rattaché à aucun vendeur. Contactez l'administrateur.", true);
    setIdentity();
    renderHome();
    return;
  }
  setIdentity();
  if(ME.admin) FILTERS.secteur="all";

  // Le cache permet d'afficher immédiatement ; une coupure réseau ne doit pas
  // laisser l'écran vide ni empêcher de consulter ce qu'on a déjà.
  renderHome();
  updateMineBadge();

  try{
    await loadClients();
    await flushQueue();
    await loadStatuses(false);
    await loadBoard();
    saveCache();
    ONLINE=true; banner(null);
  }catch(e){
    ONLINE=false;
    console.warn("Chargement impossible", e);
    banner(CLIENTS.length
      ? "Pas de connexion — affichage du dernier état connu."
      : "Pas de connexion au serveur. Réessayez avec le bouton de rafraîchissement.", true);
  }
  syncLabel();
  repaint(false);
  startPolling();
}

async function init(){
  bindLogin();

  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>switchView(t.dataset.view));
  $("#refreshBtn").onclick=e=>refresh(e.currentTarget);
  $("#logoutBtn").onclick=()=>{ if(confirm("Se déconnecter de cet appareil ?")) signOut(); };

  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && ME) refresh(null,true); });
  window.addEventListener("online", ()=>{ if(ME){ ONLINE=true; banner(null); refresh(null,true); } });
  window.addEventListener("offline",()=>{ ONLINE=false; syncLabel();
    banner("Hors connexion — vos saisies sont gardées et repartiront au retour du réseau."); });
  window.addEventListener("beforeunload", e=>{ if(QUEUE.length){ e.preventDefault(); e.returnValue=""; } });

  if(!SB_READY){
    showLogin("");
    banner("Synchronisation non configurée — renseignez SUPABASE_URL et SUPABASE_ANON_KEY en haut du fichier.", true);
    $("#loginOk").disabled = true;
    return;
  }

  SESSION = readLS(SESSION_KEY, null);
  if(SESSION && SESSION.refresh_token){
    try{
      // la session dort peut-être depuis des heures : on la renouvelle d'emblée
      await refreshSession();
      await startApp();
      return;
    }catch(e){
      SESSION=null; dropLS(SESSION_KEY);
    }
  }
  showLogin();
}
init();
</script>
